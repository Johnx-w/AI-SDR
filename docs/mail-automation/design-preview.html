    <script>
      'use strict';
      const stage = document.getElementById('stage');
      const modal = document.getElementById('modal');
      let toastTimer;
      function icon(name, size = 18) {
        const key = String(name)
          .replace(/([a-z])([A-Z])/g, '$1-$2')
          .replace(/[_\s]/g, '-')
          .toLowerCase();
        const d = ICONS[key] || ICONS['circle-dot'];
        return (
          '<svg aria-hidden="true" width="' +
          Number(size) +
          '" height="' +
          Number(size) +
          '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round">' +
          d +
          '</svg>'
        );
      }
      function esc(s) {
        return String(s ?? '').replace(
          /[&<>"']/g,
          (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c],
        );
      }
      function toast(s) {

            '. At ' +
            s.brand +
            ', we work with ' +
            product +
            '.';
          const excerpt = (x) =>
            x
              .replace(/^Hi [^\n]*\n+/i, '')
              .trim()
              .split(/(?<=[.?!])\s+/)[0]
              .slice(0, 140);
          const original = first
            ? 'I wanted to follow up on “' + first.subject.replace(/^Re:\s*/i, '') + '”.'

            latest && latest !== first

              p[0].split(' ')[0] +

              (trial.i ? original + follow : introduction) +

            return 'Are there particular finishes or fabrics you have in mind?';
          if (/预算|budget|价格|报价/i.test(note))
            return 'Would you like to discuss a target budget for this project?';
          if (/样品|sample/i.test(note))
            return 'We could start by identifying a suitable sample for your project.';

              date: projected(c, st.day, m.first),

            closeModal();
            draw(true);

          toast('已保存该客户的邮件草稿');

          if (e.target.id === 'ap-filter') {

            case 'open':

              return draw();
            case 'tab':
              tab = b.dataset.key;
              return draw();

              const id = c.steps[n].id;

        function importer(revision = false) {

            (d
              ? '<p class="kn-hint">新版本保存后需重新授权，历史版本可在资料详情查看。</p>'

          let extras = [];
          const f = form(
            d ? '上传新版本' : '导入产品资料',

            async (f, fd) => {

        function meta(bulk = false) {

        function correct(j) {
          const d = item(),

            '校对引用片段',

              input('keywords', '匹配关键词', (e.keywords || []).join('，')) +

              if (!text || !loc) throw Error('请填写来源位置与引用内容。');
              const corrected = {

              if (v.type === 'PDF') {

                const p = /\d+/.exec(loc);

                const m = /^(.+)!([A-Z]+)([1-9]\d*)$/i.exec(loc);

        const ignored = new Set(
          'a an the i we us our you your it its is are be been was were have has for of on to from in can could would what which why how may do does am and or with this that these those hi hello thanks thank please let know about me tell request question inquiry re fw fwd product products item details need want 的 了 吗 您好 你好 请问 请 关于 提供 是否 我们 你们 这个 产品 参数 规格 需要'.split(

          const parts = s.match(/[a-z0-9]+(?:-[a-z0-9]+)*/g) || [];

          if (!q.trim()) return { e: candidates[0], matches: [] };
          const askedModels = models(q),
            titleModels = models(normalized(d.title + ' ' + v.name)),

        const btn = (text, click, style = '') =>

        function metric(title, num, key, extra = '') {

              scored.length ? '%' : '',

        function render() {

      <div class="ac-overview" id="ac-metrics"></div><div class="panel ac-list"><div class="ac-listhead"><h2>邮箱账号 <span class="ac-count" id="ac-total"></span></h2></div>

        function closeDrawer() {

          if (!d.open) d.showModal();

        function overview(a) {
          return `<dl class="ac-info"><dt>账号状态</dt><dd>${pill(a)}</dd><dt>连接检查</dt><dd class="ac-status-res"><span class="${a.connected ? 'ac-success' : 'ac-failure'}">SMTP · ${a.connected ? '通过' : '失败'}</span><span class="${a.connected ? 'ac-success' : 'ac-failure'}">IMAP · ${a.connected ? '通过' : '失败'}</span><small class="ac-service-status">模拟验证</small></dd><dt>所属官网</dt><dd>${h(brandOf(a).website)}</dd><dt>标签</dt><dd class="ac-taglist right">${tagChips(a)}</dd><dt>可推产品</dt><dd class="ac-granted">${tagsText(productsOf(a))}</dd><dt>回复资料</dt><dd class="ac-granted">${tagsText(selectedSources(a).map((x) => x.title))}</dd><dt>负责人</dt><dd>${h(a.sender)}</dd><dt>接待策略</dt><dd>${h(a.mode)}</dd><dt>今日发送</dt><dd>${a.sent} / ${a.limit}</dd></dl><div class="ac-inline">${a.connected ? btn(a.active ? '暂停发送' : '恢复发送', `acDemo.flip(${a.id})`) : ''}${btn('重新验证', `acDemo.reconnect(${a.id})`)}</div>`;

        function save(event, id) {

        function splitValues(input) {
          return [
            ...new Set(
              String(input || '')
                .split(/[,，、;\n]/)
                .map((s) => s.trim())
                .filter(Boolean),
            ),

        }

        function modal(title, body) {

        const backToTags = () => btn('返回', 'acDemo.tags()');
        function tags() {

              mode === 'rename'

        function writeTag(event, id, mode = 'create') {

            accounts.forEach((a) => {

        function assign() {

    <script>
      const fixtureDay = '2026-11-22';

        const items = window.mailDesignMailboxes?.() || [];

      function signed(i) {

      function pickSources(c, purpose = 'cop') {
        return window.mailDesignSelectedSources?.(boxEmails[c.box], purpose) || [];
      }
      function evidenceFor(c, purpose) {
        const q = (c.subject + ' ' + (c.latestInbound || c.body)).toLowerCase().normalize('NFKC');
        const others = (window.mailDesignMailboxes?.() || []).filter(
          (a) =>
            a.email.toLowerCase() !== boxEmails[c.box].toLowerCase() && a.brand !== boxNames[c.box],
        );
        if (
          others.some(
            (a) =>
              q.includes(a.brand.toLowerCase()) || q.includes(a.email.split('@')[1].toLowerCase()),
          )
        )
          return null;
        const commercial =
          /price|quot(?:ation|e)|discount|ship|deliver|lead time|库存|报价|价格|交期|shipping|arrival/i;
        const wantsCommercial = commercial.test(q);
        const words = (s) =>
          s
            .toLowerCase()
            .normalize('NFKC')
            .match(/[a-z0-9]+(?:[-.][a-z0-9]+)*/g) || [];
        const models = [...new Set(words(q).filter((w) => /[a-z]/.test(w) && /\d/.test(w)))];
        const hits = [];
        for (const source of pickSources(c, purpose)) {
          const e = window.mailDesignEvidence?.(source.id, q);
          if (!e?.quote) continue;
          const terms = words(e.quote + ' ' + source.title + ' ' + (e.keywords || []).join(' '));
          if (
            models.some((model) => !terms.includes(model)) ||
            (wantsCommercial && !commercial.test(e.quote))
          )
            continue;
          const matches = (e.keywords || []).filter(
            (k) => k && q.includes(String(k).toLowerCase()),
          ).length;

          if (points) hits.push({ source, e, points });

        hits.sort((a, b) => b.points - a.points);

          return null;
        return hits[0] || null;

      function businessPage() {
        workPage(
          '跟进任务',
          '',
          `<section class="work-card"><header class="card-head"><h2>待审核回复 <small>${convs.filter((c) => c.review).length}</small></h2><button class="link-text" onclick="openReviewQueue()">查看全部</button></header>${reviewRows()}</section><section class="work-card"><header class="card-head"><h2>自动邮件跟进</h2><button class="link-text" onclick="go('sequences')">查看跟进序列</button></header><div class="row-item"><div class="row-icon">${icon('workflow', 17)}</div><div><b>未回复客户的后续步骤</b><small>在序列中查看发送日期和执行中的联系人</small></div></div></section>`,
        );
      }
      function connectionPage() {
        workPage(
          'API 连接',
          '',
          `<section class="work-card"><header class="card-head"><h2>销售邮件</h2></header><div class="row-item"><div class="row-icon">${icon('mailbox', 17)}</div><div><b>邮箱通道</b><small>${boxEmails.length} 个模拟邮箱</small></div><div class="spacer"></div><button class="action" onclick="go('accounts')">管理邮箱</button></div><div class="row-item"><div class="row-icon">${icon('sparkles', 17)}</div><div><b>语言模型</b><small>本次演示使用本地模拟生成</small></div><div class="spacer"></div><button class="action" onclick="go('sequences')">试写邮件</button></div></section>`,
        );
      }
      function leadTable(rows) {
        return `<div class="table-wrap"><table class="work-table"><thead><tr><th>公司 / 联系人</th><th>所在地</th><th>负责邮箱</th><th>沟通</th></tr></thead><tbody>${rows.map((c) => `<tr><td><button class="link-text" onclick="go('leads/${c.id}')">${esc(c.company)}</button><small>${esc(c.name)}</small></td><td>${esc(c.city)}</td><td>${esc(boxNames[c.box])}</td><td><button class="link-text" onclick="go('inbox/${c.id}')">打开会话</button></td></tr>`).join('')}</tbody></table></div>${rows.length ? '' : '<div class="work-empty">未找到匹配的客户</div>'}`;
      }
      function leadResults() {
        const q = workState.q.toLowerCase();
        return convs
          .filter(
            (c, i) => convs.findIndex((t) => t.email.toLowerCase() === c.email.toLowerCase()) === i,
          )
          .filter(
            (c) =>
              (workState.brand === 'all' || +workState.brand === c.box) &&
              [c.company, c.email, c.name, c.subject, c.tag].some((x) =>
                x.toLowerCase().includes(q),
              ),
          );
      }
      function leadLibrary() {
        const rows = leadResults();
        workPage(
          '客户库',
          '',
          `<div class="work-card"><div class="work-filters">${icon('search', 16)}<input id="lead-query" class="work-input" aria-label="查找客户" placeholder="搜索公司、联系人或邮箱" value="${esc(workState.q)}" oninput="workState.q=this.value;refreshLeads()"><select class="work-input" aria-label="客户负责邮箱" onchange="workState.brand=this.value;refreshLeads()"><option value="all">全部邮箱</option>${boxNames.map((b, i) => `<option value="${i}" ${String(i) === workState.brand ? 'selected' : ''}>${esc(b)}</option>`).join('')}</select><span class="muted" id="lead-count">${rows.length} 家公司</span></div><div id="lead-table">${leadTable(rows)}</div></div>`,
        );
      }
      function refreshLeads() {
        let rows = leadResults();
        document.getElementById('lead-table').innerHTML = leadTable(rows);
        document.getElementById('lead-count').textContent = rows.length + ' 家公司';
      }
      function showLead(id) {
        const c = convs.find((x) => x.id === id);
        workPage(
          c.company,
          c.name + ' · ' + c.role,
          `<button class="link-back" onclick="go('leads')">${icon('arrow-left', 14)} 返回客户库</button><div class="split-cards"><section class="work-card"><header class="card-head"><h2>客户档案</h2></header><dl class="key-value"><dt>邮箱</dt><dd>${esc(c.email)}</dd><dt>所在城市</dt><dd>${esc(c.city)}</dd><dt>负责邮箱</dt><dd><button class="link-text" onclick="go('accounts/${c.box}')">${esc(boxEmails[c.box])}</button></dd><dt>来源</dt><dd>${c.newMail || c.received ? '邮件往来' : `<button class="link-text" onclick="go('automation/${c.box}')">${taskNames[c.box]}</button>`}</dd>${c.newMail || c.received ? '' : `<dt>产品机会</dt><dd>${taskEvidence[c.box]}</dd>`}</dl></section><section class="work-card"><header class="card-head"><h2>最近沟通</h2></header><div class="row-item"><div class="row-icon">${icon('mail', 16)}</div><div><b>${esc(c.subject)}</b><small>${esc(c.snippet)}</small></div></div></section></div>`,
          `<button class="action primary" onclick="go('inbox/${c.id}')">${icon('messages-square', 15)} 打开邮件会话</button>`,
        );
      }
      document
        .querySelectorAll('[data-icon]')
        .forEach((node) => (node.innerHTML = icon(node.dataset.icon, 16)));
      document.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
          e.preventDefault();
          document.querySelector('#global-search input').focus();
        }
        if (
          e.key === 'Escape' &&
          document.getElementById('project-side').classList.contains('open')
        ) {
          toggleSidebar(false);
          document.getElementById('side-open').focus();
        }
      });
      matchMedia('(max-width:760px)').addEventListener('change', () => toggleSidebar(false));
      window.addEventListener('hashchange', displayPage);
    </script>
    <script>
      for (const c of convs.filter((c) => c.review)) draftReply(c);
      displayPage();
    </script>
  </body>
</html>

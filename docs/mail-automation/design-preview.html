<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>沟通中心 · AI-SDR</title>
    <style>
      :root {
        --ink: #19272b;
        --muted: #667579;
        --line: #dde4e3;
        --teal: #146652;
        --soft: #e5f2ec;
        --bg: #f6f8f7;
        --paper: #fff;
        --shadow: 0 12px 48px #19272b21;
        font-family: Inter, 'Segoe UI', 'Microsoft YaHei UI', 'PingFang SC', Arial, sans-serif;
        color: var(--ink);
        font-size: 14px;
        font-synthesis: none;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
      }
      button,
      input,
      textarea,
      select {
        font: inherit;
        color: inherit;
      }
      button,
      summary,
      select {
        cursor: pointer;
      }
      button {
        border: none;
        background: none;
      }
      a {
        color: var(--teal);
      }
      button:focus-visible,
      a:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible,
      summary:focus-visible {
        outline: 2px solid #278271;
        outline-offset: 2px;
      }
      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      button:hover:not(:disabled) {
        filter: brightness(0.96);
      }
      h1,
      h2,
      h3,
      h4,
      p {
        margin: 0;
      }
      svg {
        display: inline-block;
        vertical-align: middle;
        flex-shrink: 0;
      }
      input,
      textarea,
      select {
        max-width: 100%;
      }
      .muted {
        color: var(--muted);
      }
      .action {
        display: inline-flex;
        gap: 7px;
        align-items: center;
        justify-content: center;
        border: 1px solid #d8dfdd;
        border-radius: 7px;
        background: white;
        padding: 8px 13px;
        font-weight: 540;
        line-height: 1.35;
        white-space: nowrap;
      }
      .action.primary {
        border-color: var(--teal);
        background: var(--teal);
        color: white;
      }
      .icon-only {
        padding: 7px;
      }
      .chip {
        display: inline-flex;
        gap: 4px;
        align-items: center;
        border-radius: 5px;
        padding: 3px 7px;
        font-size: 12px;
        background: var(--soft);
        color: var(--teal);
        white-space: nowrap;
      }
      .tabs {
        display: flex;
        gap: 14px;
        border-bottom: 1px solid var(--line);
      }
      .tabs button {
        padding: 9px 5px;
        color: var(--muted);
      }
      .tabs .active {
        color: var(--ink);
        box-shadow: inset 0 -2px var(--teal);
      }
      .panel,
      .table-wrap {
        background: white;
        border: 1px solid var(--line);
        border-radius: 10px;
      }
      .table-wrap {
        overflow: auto;
      }
      .data-table {
        width: 100%;
        border-collapse: collapse;
      }
      .data-table :is(td, th) {
        padding: 13px 16px;
        text-align: left;
        border-bottom: 1px solid var(--line);
      }
      .data-table th {
        font-weight: 540;
        color: var(--muted);
        font-size: 12px;
      }
      .module {
        padding: 26px 32px;
        min-height: 100%;
      }
      .module-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 22px;
      }
      .module-head h1 {
        font-size: 25px;
      }
      .top {
        height: 62px;
        background: #172c2c;
        color: #f2f7f2;
        display: flex;
        align-items: center;
        padding: 0 21px;
        gap: 33px;
        border-bottom: 1px solid #0e2221;
      }
      .wordmark {
        display: flex;
        align-items: center;
        gap: 10px;
        letter-spacing: -1px;
        font-size: 23px;
        font-weight: 700;
        white-space: nowrap;
      }
      .brandmark {
        width: 32px;
        height: 32px;
        background: #d4f29b;
        border-radius: 9px;
        display: grid;
        place-items: center;
        color: #18332d;
      }
      .top nav {
        display: flex;
        align-self: stretch;
        align-items: center;
        gap: 5px;
      }
      .nav-item {
        color: #becdca;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 9px 16px;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 550;
      }
      .nav-item:hover,
      .nav-item.on {
        background: #344d48;
        color: #fff;
      }
      .topright {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 15px;
      }
      .demo {
        color: #d1dcd5;
        font-size: 12px;
        white-space: nowrap;
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .demo i {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #c5e893;
      }
      .toptool {
        padding: 6px;
        color: #d5e0dd;
      }
      .avatar {
        display: inline-grid;
        place-items: center;
        border-radius: 50%;
        font:
          650 12px/1 Inter,
          'Segoe UI',
          sans-serif;
        width: 32px;
        height: 32px;
        flex-shrink: 0;
        letter-spacing: -0.3px;
      }
      .me {
        background: #cbded2;
        color: #355543;
      }
      .topright > .avatar {
        border: 2px solid #567569;
      }
      .stage {
        height: calc(100dvh - 62px);
        overflow: auto;
        background: #fff;
      }
      .fr {
        display: grid;
        grid-template-columns: 185px 300px minmax(340px, 1fr) 221px;
        height: 100%;
        min-height: 440px;
        overflow: hidden;
      }
      .fr.no-contact {
        grid-template-columns: 185px 300px minmax(340px, 1fr);
      }
      .fr-folders,
      .fr-list,
      .fr-thread,
      .fr-contact {
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      .fr-folders,
      .fr-list,
      .fr-thread {
        border-right: 1px solid var(--line);
      }
      .fr-folders {
        background: #f4f6f4;
        padding: 21px 11px 12px;
        gap: 0;
        overflow: auto;
      }
      .fr-team {
        display: flex;
        align-items: center;
        gap: 9px;
        font-weight: 650;
        padding: 0 4px 20px;
      }
      .fr-team small {
        display: block;
        font-size: 11px;
        color: var(--muted);
        font-weight: 450;
        margin-top: 3px;
      }
      .teamicon {
        display: grid;
        place-items: center;
        width: 33px;
        height: 33px;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 8px;
        color: #4e695e;
      }
      .compose {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 9px;
        background: #fff;
        border: 1px solid #ccd5d1;
        box-shadow: 0 1px 2px #19392c08;
        border-radius: 7px;
        font-weight: 600;
      }
      .groupname {
        font-size: 11px;
        color: #62716a;
        margin: 25px 8px 8px;
        font-weight: 600;
        letter-spacing: 0.5px;
      }
      .folder {
        display: flex;
        align-items: center;
        gap: 9px;
        width: 100%;
        padding: 9px 9px;
        text-align: left;
        color: #47564f;
        font-size: 13px;
        border-radius: 6px;
      }
      .folder:hover {
        background: #e9eeea;
      }
      .folder.on {
        background: #dcebe2;
        color: #204d3d;
        font-weight: 650;
      }
      .folder .n {
        margin-left: auto;
        font-size: 11px;
        font-variant-numeric: tabular-nums;
        color: #66786e;
      }
      .point {
        display: inline-block;
        width: 9px;
        height: 9px;
        border-radius: 3px;
        flex-shrink: 0;
      }
      .fr-bottom {
        margin-top: auto;
        padding-top: 24px;
      }
      .fr-bottom button {
        display: flex;
        align-items: center;
        gap: 8px;
        color: #576860;
        font-size: 12px;
      }
      .fr-list {
        background: white;
      }
      .list-title {
        padding: 20px 16px 12px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .list-title h1 {
        font-size: 21px;
        line-height: 1.3;
        letter-spacing: -0.7px;
      }
      .count {
        background: #eff3ef;
        font-size: 11px;
        color: #67786d;
        padding: 3px 6px;
        border-radius: 5px;
        font-weight: 650;
      }
      .fr-viewtabs {
        display: flex;
        gap: 17px;
        padding: 0 16px;
        border-bottom: 1px solid var(--line);
      }
      .fr-viewtabs button {
        color: #748078;
        padding: 8px 0 10px;
        font-size: 12px;
      }
      .fr-viewtabs .on {
        color: #235944;
        box-shadow: inset 0 -2px #34755a;
        font-weight: 600;
      }
      .filterbox {
        margin: 10px 14px;
        display: flex;
        align-items: center;
        gap: 7px;
        color: #738077;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #fbfcfb;
        padding: 6px 9px;
      }
      .filterbox input {
        width: 100%;
        border: 0;
        outline: 0;
        background: transparent;
        font-size: 12px;
      }
      .fr-items {
        overflow: auto;
        border-top: 1px solid var(--line);
        flex: 1;
      }
      .conv {
        position: relative;
        display: block;
        width: 100%;
        text-align: left;
        border-bottom: 1px solid #e7ebe8;
        padding: 13px 15px 12px 21px;
        background: white;
      }
      .conv.on {
        background: #eef5ef;
        box-shadow: inset 3px 0 #337c59;
      }
      .conv:hover {
        background: #f6f8f5;
      }
      .conv .who {
        display: flex;
        gap: 8px;
        align-items: center;
        font-size: 13px;
        line-height: 22px;
      }
      .who strong {
        white-space: nowrap;
        text-overflow: ellipsis;
        overflow: hidden;
      }
      .who .avatar {
        height: 23px;
        width: 23px;
        font-size: 9px;
      }
      .conv time {
        margin-left: auto;
        white-space: nowrap;
        font-size: 11px;
        color: #68766f;
      }
      .dotunread {
        position: absolute;
        left: 9px;
        top: 22px;
        width: 5px;
        height: 5px;
        background: #328560;
        border-radius: 50%;
      }
      .subj,
      .snippet {
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .subj {
        font-size: 13px;
        font-weight: 600;
        margin: 5px 0;
      }
      .snippet {
        font-size: 12px;
        color: #768078;
      }
      .tag {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 10px;
        line-height: 1.35;
        padding: 2px 6px;
        font-weight: 550;
        border-radius: 4px;
        margin: 8px 4px 0 0;
        background: #ecf0ec;
        color: #506353;
      }
      .tag.amber {
        background: #f8edd2;
        color: #876321;
      }
      .tag.lilac {
        background: #eee9f7;
        color: #755396;
      }
      .tag.blue {
        background: #e6eef7;
        color: #476887;
      }
      .tag.rose {
        background: #fae7e4;
        color: #96574e;
      }
      .fr-empty {
        padding: 30px 18px;
        text-align: center;
        color: var(--muted);
        font-size: 13px;
      }
      .fr-tools {
        display: flex;
        align-items: center;
        gap: 7px;
        height: 51px;
        flex-shrink: 0;
        padding: 0 19px;
        border-bottom: 1px solid var(--line);
      }
      .iconbtn {
        display: inline-grid;
        place-items: center;
        padding: 6px;
        border-radius: 5px;
        color: #596960;
      }
      .iconbtn:hover {
        background: #edf2ed;
      }
      .fr-tools .assign {
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 12px;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 4px 7px;
        color: #48554c;
      }
      .fr-tools .avatar {
        width: 19px;
        height: 19px;
        font-size: 8px;
      }
      .spacer {
        flex: 1;
      }
      .fr-thread {
        background: #fcfdfb;
        min-height: 0;
      }
      .fr-message-area {
        flex: 1;
        overflow: auto;
        min-height: 0;
        padding: 24px clamp(17px, 2vw, 35px) 20px;
      }
      .fr-thread-title {
        font-size: clamp(21px, 1.8vw, 30px);
        line-height: 1.2;
        letter-spacing: -1px;
        font-weight: 650;
        color: #1f2b24;
      }
      .topic-line {
        display: flex;
        gap: 6px;
        align-items: center;
        margin-top: 7px;
      }
      .topic-line .tag {
        font-size: 11px;
        margin: 0;
      }
      .thread-date {
        display: flex;
        align-items: center;
        gap: 12px;
        color: #89938a;
        font-size: 10px;
        margin: 21px 0 15px;
        text-align: center;
      }
      .thread-date:before,
      .thread-date:after {
        content: '';
        height: 1px;
        background: #e0e6df;
        flex: 1;
      }
      .fr-card {
        background: white;
        border: 1px solid #dce3da;
        border-radius: 8px;
        margin-bottom: 10px;
      }
      .fr-card summary {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 10px 13px;
        font-size: 12px;
        list-style: none;
      }
      .fr-card summary span:nth-last-child(2) {
        color: var(--muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        flex: 1;
      }
      .fr-card .mailhead {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 15px 16px 0;
      }
      .mailhead strong {
        font-size: 13px;
      }
      .mailhead small {
        display: block;
        font-size: 11px;
        color: var(--muted);
        margin-top: 3px;
        overflow-wrap: anywhere;
      }
      .mailhead time {
        white-space: nowrap;
        font-size: 10px;
        color: var(--muted);
        margin-left: auto;
      }
      .mailbody {
        padding: 10px 16px 15px;
        line-height: 1.55;
        font-size: 13px;
        color: #34403b;
        white-space: pre-line;
        overflow-wrap: anywhere;
      }
      .internal {
        background: #fff8df;
        border: 1px solid #ede2af;
        border-radius: 7px;
        padding: 10px 13px;
        font-size: 12px;
        line-height: 1.5;
        color: #685a36;
      }
      .internal b {
        display: inline-flex;
        gap: 5px;
        align-items: center;
        margin-bottom: 2px;
        color: #635533;
      }
      .fr-compose-wrap {
        background: #fcfdfb;
        padding: 9px clamp(17px, 2vw, 35px) 18px;
      }
      .fr-compose {
        border: 1px solid #bfcfc2;
        border-radius: 8px;
        background: white;
        box-shadow: 0 2px 6px #1d3c230b;
        padding: 0 12px 9px;
      }
      .fr-compose.note {
        background: #fffae7;
      }
      .reply-tabs {
        display: flex;
        gap: 12px;
        align-items: center;
        border-bottom: 1px solid #e9ede7;
        height: 34px;
      }
      .reply-tabs button {
        display: flex;
        align-items: center;
        gap: 4px;
        font-size: 11px;
        height: 100%;
        padding: 0 2px;
        color: var(--muted);
      }
      .reply-tabs .on {
        color: #365b46;
        box-shadow: inset 0 -2px #72997a;
        font-weight: 600;
      }
      .fr-compose textarea {
        border: 0;
        outline: 0;
        background: transparent;
        width: 100%;
        height: 72px;
        min-height: 45px;
        resize: vertical;
        padding: 11px 1px;
        font-size: 13px;
        line-height: 1.45;
      }
      .fr-send {
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .fr-send .action {
        font-size: 12px;
        padding: 6px 13px;
      }
      .fr-send .muted {
        font-size: 11px;
      }
      .fr-contact {
        overflow: auto;
        background: white;
      }
      .fr-contact .ct-title {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 0 16px;
        height: 51px;
        border-bottom: 1px solid var(--line);
        flex-shrink: 0;
        font-size: 13px;
        font-weight: 600;
      }
      .ct-body {
        padding: 18px 16px;
      }
      .ct-hero .avatar {
        height: 49px;
        width: 49px;
        font-size: 18px;
        border-radius: 13px;
      }
      .ct-hero h3 {
        font-size: 18px;
        margin: 10px 0 4px;
        letter-spacing: -0.35px;
      }
      .ct-hero small {
        font-size: 12px;
        color: var(--muted);
      }
      .ct-section {
        padding: 18px 0;
        border-bottom: 1px solid var(--line);
      }
      .ct-section:last-child {
        border-bottom: 0;
      }
      .ct-section h4 {
        font-size: 12px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .ct-section dl {
        margin: 12px 0 0;
        font-size: 12px;
      }
      .ct-section dt {
        color: #7b857f;
        font-size: 11px;
        margin: 11px 0 3px;
      }
      .ct-section dd {
        margin: 0;
        overflow-wrap: anywhere;
      }
      .ct-section .tag {
        margin-top: 9px;
      }
      .ct-seq {
        font-size: 12px;
        line-height: 1.5;
        color: #506158;
        margin-top: 9px;
      }
      .ct-link {
        color: var(--teal);
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 12px;
        padding: 8px 0 0;
      }
      .mobile-btn {
        display: none;
      }
      dialog {
        color: var(--ink);
        width: min(480px, 92vw);
        max-height: 88dvh;
        padding: 0;
        border: 1px solid var(--line);
        border-radius: 12px;
        box-shadow: var(--shadow);
        overflow: auto;
      }
      dialog::backdrop {
        background: #1425214f;
      }
      .dlg-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px 20px;
        border-bottom: 1px solid var(--line);
      }
      .dlg-head h2 {
        font-size: 17px;
      }
      .dlg-body {
        padding: 20px;
      }
      .field {
        display: grid;
        gap: 6px;
        margin: 0 0 14px;
        font-size: 13px;
      }
      .field :is(input, select, textarea) {
        padding: 9px;
        border: 1px solid var(--line);
        border-radius: 6px;
        width: 100%;
        background: #fff;
      }
      .field textarea {
        min-height: 88px;
      }
      .choices {
        display: grid;
        gap: 6px;
      }
      .choices button,
      .source-link {
        display: flex;
        align-items: center;
        gap: 9px;
        text-align: left;
        padding: 10px 12px;
        background: #f4f7f3;
        border-radius: 6px;
      }
      .source-link {
        text-decoration: none;
        color: var(--ink);
        font-size: 13px;
        justify-content: space-between;
      }
      .toast {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        padding: 9px 18px;
        border-radius: 7px;
        color: white;
        background: #243e36;
        z-index: 90;
        box-shadow: var(--shadow);
        font-size: 13px;
        pointer-events: none;
      }
      .toast:empty {
        display: none;
      }
      @media (min-width: 1580px) {
        .fr {
          grid-template-columns: 208px 335px minmax(420px, 1fr) 260px;
        }
        .fr.no-contact {
          grid-template-columns: 208px 335px minmax(420px, 1fr);
        }
      }
      @media (max-width: 1190px) {
        .fr,
        .fr.no-contact {
          grid-template-columns: 166px 264px minmax(300px, 1fr);
        }
        .fr-contact {
          display: none;
        }
        .top {
          gap: 18px;
        }
        .nav-item {
          padding: 8px 12px;
        }
        .fr-tools {
          padding: 0 12px;
        }
      }
      @media (max-width: 850px) {
        .fr,
        .fr.no-contact {
          grid-template-columns: 215px minmax(280px, 1fr);
        }
        .fr-folders {
          display: none;
        }
        .mobile-btn.folders-btn {
          display: inline-grid;
        }
        .top {
          padding: 0 12px;
          gap: 12px;
        }
        .topright {
          gap: 2px;
        }
        .toptool {
          display: inline-grid;
        }
        .nav-item {
          padding: 8px;
        }
        .module {
          padding: 20px 16px;
        }
        .fr-tools {
          gap: 3px;
        }
        .top .demo {
          font-size: 0;
        }
      }
      @media (max-width: 620px) {
        .top {
          height: 88px;
          display: grid;
          grid-template-columns: 1fr auto;
          grid-template-rows: 41px 44px;
          gap: 0;
          padding: 1px 12px 2px;
        }
        .wordmark {
          font-size: 18px;
        }
        .brandmark {
          width: 24px;
          height: 24px;
          border-radius: 6px;
        }
        .brandmark svg {
          width: 17px;
        }
        .top nav {
          grid-row: 2;
          grid-column: 1/-1;
          justify-content: space-between;
          gap: 0;
        }
        .topright {
          grid-column: 2;
          grid-row: 1;
        }
        .top .demo {
          font-size: 11px;
        }
        .topright > .avatar {
          width: 24px;
          height: 24px;
          margin-left: 10px;
          font-size: 10px;
        }
        .nav-item {
          font-size: 12px;
          gap: 4px;
        }
        .nav-item svg {
          width: 15px;
        }
        .stage {
          height: calc(100dvh - 88px);
        }
        .fr,
        .fr.no-contact {
          display: flex;
          height: 100%;
          min-height: 0;
        }
        .fr-list {
          flex: 1;
        }
        .fr-thread {
          display: none;
          flex: 1;
          overflow: hidden;
        }
        .fr.mobile-detail .fr-thread {
          display: flex;
        }
        .fr.mobile-detail .fr-list {
          display: none;
        }
        .mobile-btn.back-btn {
          display: inline-grid;
        }
        .fr-compose-wrap {
          padding: 6px 12px 10px;
        }
        .fr-message-area {
          padding: 18px 12px;
        }
        .fr-compose textarea {
          height: 60px;
        }
        .fr-card .mailhead {
          padding: 12px 10px 0;
        }
        .mailbody {
          padding: 10px;
        }
        .fr-tools .assign {
          font-size: 11px;
        }
        .module {
          padding: 16px 12px;
        }
        .module-head {
          align-items: flex-start;
          flex-wrap: wrap;
        }
      }

      .fr {
        grid-template-rows: minmax(0, 1fr);
      }
      .fr-folders,
      .fr-list,
      .fr-contact {
        min-height: 0;
      }
      .fr-compose-wrap {
        flex-shrink: 0;
      }
      .fr-card summary {
        min-width: 0;
      }
      .fr-card summary b {
        white-space: nowrap;
      }
      .fr-list .conv time {
        line-height: 1.4;
      }
      .ct-section dd .mail-link {
        overflow-wrap: anywhere;
      }
      .fr-review {
        display: flex;
        align-items: center;
        gap: 5px;
        margin: 8px 0 0;
        color: #75522d;
        font-size: 12px;
        font-weight: 600;
      }

          const target = e.target.closest('[data-ap]');

          const cmd = target.dataset.ap,
            n = Number(target.dataset.n),
            s = seq();

            list = true;
            draw();
            return;

          if (cmd === 'open') {
            selectSeq(n);

          if (cmd === 'tab') {

            return;

          if (cmd === 'activate') {

          if (cmd === 'outline') {
            outline = !outline;

            return;

          if (cmd === 'save') {

              return;

            if (!n) s.subject = sub;
            s.bodies[n] = body;
            closeModal();
            preserveScroll();
            toast('邮件已保存');
            return;
          }
          if (cmd === 'timing') {
            openModal(
              '开始此步骤的时间',
              '<div class="ap-form"><label class="ap-field">距上一步的天数<input id="ap-days" type="number" step="1" min="1" max="60" value="' +
                s.delays[n] +
                '"></label><div class="ap-drawer-actions">' +
                btn('cancel', '取消') +
                btn('saveTime', '保存间隔', 'ap-dark', n) +
                '</div></div>',
            );
            return;
          }
          if (cmd === 'saveTime') {
            const days = Number($('days').value);
            if (!Number.isInteger(days) || days < 1 || days > 60) {
              toast('请输入 1 到 60 之间的整数');
              return;
            }
            s.delays[n] = days;
            closeModal();
            preserveScroll();
            return;
          }
          if (cmd === 'create') {
            openModal(
              '新建跟进序列',
              '<div class="ap-form"><label class="ap-field">序列名称<input id="ap-newname" type="text" maxlength="65" placeholder="输入序列名称"></label><label class="ap-field">邮件模板<select id="ap-template">' +
                templates

                btn('cancel', '取消') +
                btn('new', '创建序列', 'ap-yellow') +
                '</div></div>',
            );
            return;

          if (cmd === 'new') {
            const name = $('newname').value.trim();
            if (!name) {
              toast('请输入序列名称');
              return;
            }
            const ns = sequence(templates[Number($('template').value)], 0);
            ns.name = name;
            ns.active = false;
            ns.members = [];
            seqs.push(ns);
            closeModal();
            selectSeq(seqs.length - 1);
            return;
          }
          if (cmd === 'enroll') {
            const available = people
              .map((p, n) => [p, n])
              .filter(([, n]) => !s.members.some((m) => m.p === n));
            openModal(
              '添加联系人',
              '<div class="ap-form"><label class="ap-field">发件邮箱<input type="text" disabled value="' +

                      n +

                      memberName(n) +
                      '</label>',
                  )
                  .join('') +
                (!available.length ? '所有模拟联系人均已加入此序列。' : '') +
                '</div><div class="ap-drawer-actions">' +
                btn('cancel', '关闭') +
                (available.length ? btn('add', '加入序列', 'ap-yellow') : '') +
                '</div></div>',
            );
            return;
          }
          if (cmd === 'add') {
            const ids = [...document.querySelectorAll('.ap-enroll-check:checked')].map((el) =>
              Number(el.value),
            );
            if (!ids.length) {
              toast('请选择联系人');

            ids.forEach((p) => s.members.push({ p, step: 0 }));

          }
          if (cmd === 'reply') {
            s.members[n].replied = true;
            draw();
            toast('已模拟收到回复，后续步骤已取消');
            return;
          }
          if (cmd === 'cancel') closeModal();
        });

          current = brandIndex;
          list = false;
          tab = '编辑器';
          exp = [false, true, false];
          go('sequences');
        };

            const count = selected.size;
            accounts.filter((a) => selected.has(a.id)).forEach((a) => (a.active = active));
            selected.clear();
            update();
            toast(`${count} 个邮箱已${active ? '恢复' : '暂停'}发送`);
          },
          flip(id) {
            const a = byId(id);
            a.active = !a.active;
            update();
            detail(id);
            toast(a.active ? '已恢复发送' : '已暂停发送');
          },
          warm(id, drawer) {
            const a = byId(id);
            a.warm = !a.warm;
            update();
            if (drawer) detail(id, 'warmup');
            toast(a.warm ? '已开启预热' : '已暂停预热');
          },
          scopeChanged(form, id) {
            const a = byId(id),
              fields = new FormData(form);
            form.querySelector('[data-ac-grants]').innerHTML = grants(
              a,
              fields.get('website'),
              fields.getAll('products'),
              fields.getAll('sources').map(Number),
            );
          },
          save(event, id) {
            event.preventDefault();
            const f = event.target;
            const a = byId(id);
            a.sender = f.elements.sender.value.trim();
            a.website = f.elements.website.value.trim();
            a.limit = Number(f.elements.limit.value);
            a.gap = Number(f.elements.gap.value);
            const fields = new FormData(f),
              opts = choices(a),
              ids = fields.getAll('sources').map(Number);
            a.products = opts.products.filter((v) => fields.getAll('products').includes(v));
            a.sourceIds = opts.sources.filter((x) => ids.includes(x.id)).map((x) => x.id);
            a.mode = f.elements.mode.value;
            a.signature = f.elements.signature.value.trim();
            update();
            detail(id);
            toast('邮箱设置已保存');
            return false;
          },
          add(event) {
            event.preventDefault();
            const f = event.target;
            const mail = f.elements.email.value.trim();
            if (accounts.some((a) => a.mail.toLowerCase() === mail.toLowerCase())) {
              f.querySelector('[role="alert"]').textContent = '此邮箱已经连接。';
              return false;
            }
            const brand = f.elements.brand.value.trim(),
              category = f.elements.category.value.trim(),
              sender = f.elements.sender.value.trim();
            if (!brand || !category || !sender) {
              f.querySelector('[role="alert"]').textContent = '请填写品牌、产品标签和负责人。';
              return false;
            }
            accounts.push({
              id: nextId++,
              brand,
              category,
              sender,
              mail,
              products: [],
              sourceIds: [],
              initials: brand.slice(0, 2).toUpperCase(),
              tone: 'blue',
              active: false,
              warm: false,
              sent: 0,
              limit: 30,
              gap: 120,
              score: null,
              series: [0, 0, 0, 0, 0, 0, 0],
              website: 'https://' + mail.split('@')[1],
              mode: '审核草稿',
              signature: sender + '\n' + brand,
            });
            query = '';
            status = 'all';
            tag = 'all';
            selected.clear();
            closeModal();
            render();
            toast('新邮箱已模拟连接');
            return false;
          },
        };
        window.renderAccounts = render;
      })();
    </script>
    <script>
      displayPage();
    </script>
  </body>
</html>

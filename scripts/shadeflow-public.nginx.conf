map $uri $shadeflow_frame_options {
    default DENY;
    "~^/api/v1/materials/pk_[a-f0-9]{32}/document/pd_[a-f0-9]{64}$" SAMEORIGIN;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /var/www/shadeflow-acme;

    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}

server {
    listen 8443 ssl;
    server_name 47.76.84.114;
    ssl_certificate /etc/letsencrypt/live/47.76.84.114/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/47.76.84.114/privkey.pem;

    auth_basic "ShadeFlow";
    auth_basic_user_file /etc/nginx/shadeflow.htpasswd;
    auth_delay 1s;
    client_max_body_size 16m;
    add_header X-Frame-Options $shadeflow_frame_options always;
    proxy_read_timeout 10m;
    proxy_set_header Authorization "";

    location ~ "^/api/v1/materials(?:/pk_[a-f0-9]{32}/versions)?$" {
        client_max_body_size 80m;
        proxy_pass http://127.0.0.1:14311;
    }

    location / {
        proxy_pass http://127.0.0.1:14311;
    }
}

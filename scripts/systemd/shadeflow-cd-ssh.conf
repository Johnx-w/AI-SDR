# shortcut: 复用空闲443端口提供专用CD SSH，启用公网HTTPS时迁移此入口。
Port 443
ListenAddress 0.0.0.0
HostKey /etc/ssh/ssh_host_ed25519_key
PidFile /run/shadeflow-cd-ssh.pid
AuthorizedKeysFile /etc/ssh/shadeflow_cd_authorized_keys
AuthenticationMethods publickey
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin forced-commands-only
AllowUsers root
ForceCommand /srv/shadeflow/ops/node /srv/shadeflow/ops/cd-gateway.mjs
DisableForwarding yes
PermitTTY no
UsePAM yes

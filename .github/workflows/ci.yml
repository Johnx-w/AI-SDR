name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/docling/requirements.txt
      - run: python -m pip install -r server/docling/requirements.txt
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: node scripts/verify-category-preview.mjs
  release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci --omit=dev --ignore-scripts
      - run: node --test tests/release*.test.mjs
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Bundle and verify the offline Linux document reader
        run: |
          python -m pip install pex==2.107.1
          python -m pip wheel --no-deps -w "$RUNNER_TEMP/docling-wheel" ./vendor/docling
          wheel=$(find "$RUNNER_TEMP/docling-wheel" -name 'docling_slim-*.whl')
          sed "s|^\./vendor/docling$|docling-slim @ file://$wheel|" server/docling/requirements.txt > "$RUNNER_TEMP/docling-requirements.txt"
          pex -r "$RUNNER_TEMP/docling-requirements.txt" -D server/docling -m material_reader --python python3.12 --scie eager --scie-python-version 3.12 --venv -o server/docling/reader-linux
          node scripts/check-docling.mjs
          tar -cf docling-runtime.tar server/docling/reader-linux
      - uses: actions/upload-artifact@v4
        with:
          name: docling-runtime
          path: docling-runtime.tar
          compression-level: 0
          retention-days: 7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.16'
      - name: Verify sandboxed Linux website collection
        env:
          SCRAPLING_PYTHON: ${{ runner.temp }}/scrapling-venv/bin/python
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/scrapling-browsers
        run: |
          python -m venv "$RUNNER_TEMP/scrapling-venv"
          "$SCRAPLING_PYTHON" -m pip install -r server/scrapling/requirements.txt
          "$SCRAPLING_PYTHON" -m pip check
          "$SCRAPLING_PYTHON" -m playwright install --with-deps --only-shell chromium
          node --test tests/scrapling-collector.test.mjs tests/acquisition-evidence-selection.test.mjs
      - name: Bundle and verify the offline Linux website collector
        run: |
          python -m pip install pex==2.107.1
          bundle="$RUNNER_TEMP/scrapling-bundle"
          mkdir -p "$bundle/browsers"
          pex -r server/scrapling/requirements.txt -D server/scrapling -m worker --python python3.12 --scie eager --scie-python-version 3.12.16 --venv -o "$bundle/worker"
          cp -r "$RUNNER_TEMP/scrapling-browsers/chromium_headless_shell-1255" "$bundle/browsers/"
          ldd "$bundle/browsers/chromium_headless_shell-1255/chrome-headless-shell-linux64/chrome-headless-shell"
          tar -czf server/scrapling/runtime-linux.tar.gz -C "$bundle" worker browsers
          node scripts/check-scrapling.mjs
          tar -cf scrapling-runtime.tar server/scrapling/runtime-linux.tar.gz
          wc -c docling-runtime.tar scrapling-runtime.tar
      - uses: actions/upload-artifact@v4
        with:
          name: scrapling-runtime
          path: scrapling-runtime.tar
          compression-level: 0
          retention-days: 7
